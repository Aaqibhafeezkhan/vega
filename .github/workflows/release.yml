name: Release
on:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
      - name: Publish installer to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # latest.yml + blockmap are what the installed app reads to auto-update
          gh release create "${{ github.ref_name }}" release/Vega-Setup-*.exe release/Vega-Setup-*.exe.blockmap release/latest.yml --generate-notes --title "Vega ${{ github.ref_name }}"
